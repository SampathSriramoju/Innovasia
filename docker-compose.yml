version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bolkisan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bolkisan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolkisan_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/bolkisan
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/bolkisan
      - GEMINI_MODEL=gemini-3.8-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-bolkisan-dev-secret-key-32-chars-long!}
    ports:
      - "8000:8000"

  officer-dashboard:
    build:
      context: ./apps/officer-dashboard
      dockerfile: Dockerfile
    container_name: bolkisan_officer_dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

volumes:
  pgdata:
